name: ShadowsocksOne
options:
  deploymentTarget:
    iOS: "17.0"
packages:
  SharedCore:
    path: Packages/SharedCore
targets:
  Shadowsocks One:
    type: application
    platform: iOS
    sources:
      - App
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.ShadowsocksOne
        PRODUCT_NAME: ShadowsocksOne
        PRODUCT_MODULE_NAME: ShadowsocksOne
        INFOPLIST_FILE: App/Info.plist
        CODE_SIGN_ENTITLEMENTS: App/ShadowsocksOne.entitlements
        TARGETED_DEVICE_FAMILY: "1,2"
    dependencies:
      - package: SharedCore
      - target: ShadowsocksOnePacketTunnel
        embed: true

  ShadowsocksOnePacketTunnel:
    type: app-extension
    platform: iOS
    sources:
      - PacketTunnel
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.ShadowsocksOne.PacketTunnel
        PRODUCT_NAME: ShadowsocksOnePacketTunnel
        PRODUCT_MODULE_NAME: ShadowsocksOnePacketTunnel
        INFOPLIST_FILE: PacketTunnel/Info.plist
        CODE_SIGN_ENTITLEMENTS: PacketTunnel/PacketTunnel.entitlements
        SKIP_INSTALL: YES
        TARGETED_DEVICE_FAMILY: "1,2"
    dependencies:
      - package: SharedCore

  ConnectionIntegrationTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - Tests/ConnectionIntegrationTests
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.ShadowsocksOne.ConnectionIntegrationTests
        GENERATE_INFOPLIST_FILE: YES
        TARGETED_DEVICE_FAMILY: "1,2"
        TEST_HOST: ""
        BUNDLE_LOADER: ""
    dependencies:
      - target: Shadowsocks One
      - package: SharedCore
  SharedCoreXcodeTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - Packages/SharedCore/Tests/SharedCoreTests
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.ShadowsocksOne.SharedCoreXcodeTests
        GENERATE_INFOPLIST_FILE: YES
        TARGETED_DEVICE_FAMILY: "1,2"
        TEST_HOST: ""
        BUNDLE_LOADER: ""
    dependencies:
      - package: SharedCore
schemes:
  Shadowsocks One:
    build:
      targets:
        Shadowsocks One: all
        ShadowsocksOnePacketTunnel: [build]
    test:
      targets:
        - ConnectionIntegrationTests
        - SharedCoreXcodeTests
  ShadowsocksOnePacketTunnel:
    build:
      targets:
        ShadowsocksOnePacketTunnel: all
