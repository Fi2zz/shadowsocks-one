name: ShadowsocksBrowser
options:
  deploymentTarget:
    iOS: "17.0"
packages:
  SharedCore:
    path: Packages/SharedCore
targets:
  ShadowsocksBrowser:
    type: application
    platform: iOS
    sources:
      - App
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.fits.socks.browser
        DEVELOPMENT_TEAM: 8Z7LGX7B48
        CODE_SIGN_STYLE: Automatic
        PRODUCT_NAME: ShadowsocksBrowser
        PRODUCT_MODULE_NAME: ShadowsocksBrowser
        INFOPLIST_FILE: App/Info.plist
        CODE_SIGN_ENTITLEMENTS: App/ShadowsocksBrowser.entitlements
        TARGETED_DEVICE_FAMILY: "1,2"
    dependencies:
      - package: SharedCore
      - target: ShadowsocksBrowserPacketTunnel
        embed: true

  ShadowsocksBrowserPacketTunnel:
    type: app-extension
    platform: iOS
    sources:
      - PacketTunnel
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.fits.socks.browser.PacketTunnel
        DEVELOPMENT_TEAM: 8Z7LGX7B48
        CODE_SIGN_STYLE: Automatic
        PRODUCT_NAME: ShadowsocksBrowserPacketTunnel
        PRODUCT_MODULE_NAME: ShadowsocksBrowserPacketTunnel
        INFOPLIST_FILE: PacketTunnel/Info.plist
        CODE_SIGN_ENTITLEMENTS: PacketTunnel/PacketTunnel.entitlements
        SKIP_INSTALL: YES
        TARGETED_DEVICE_FAMILY: "1,2"
    dependencies:
      - package: SharedCore

  ConnectionIntegrationTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - Tests/ConnectionIntegrationTests
      - path: PacketTunnel/DNS
      - path: PacketTunnel/TCP
      - path: PacketTunnel/UDP
      - path: PacketTunnel/WireGuard
      - path: PacketTunnel/PacketTunnelProvider.swift
      - path: PacketTunnel/TunnelDiagnostics.swift
      - path: PacketTunnel/TunnelEngine.swift
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.fits.socks.browser.ConnectionIntegrationTests
        GENERATE_INFOPLIST_FILE: YES
        TARGETED_DEVICE_FAMILY: "1,2"
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/ShadowsocksBrowser.app/ShadowsocksBrowser"
        BUNDLE_LOADER: "$(TEST_HOST)"
    dependencies:
      - target: ShadowsocksBrowser
      - package: SharedCore
  SharedCoreXcodeTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - Packages/SharedCore/Tests/SharedCoreTests
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.fits.socks.browser.SharedCoreXcodeTests
        GENERATE_INFOPLIST_FILE: YES
        TARGETED_DEVICE_FAMILY: "1,2"
        TEST_HOST: ""
        BUNDLE_LOADER: ""
    dependencies:
      - package: SharedCore
schemes:
  ShadowsocksBrowser:
    build:
      targets:
        ShadowsocksBrowser: all
        ShadowsocksBrowserPacketTunnel: [build]
    test:
      targets:
        - ConnectionIntegrationTests
        - SharedCoreXcodeTests
  ShadowsocksBrowserPacketTunnel:
    build:
      targets:
        ShadowsocksBrowserPacketTunnel: all
